name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (mirrors the parent monorepo's ci.yml).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- Lint & format: standalone ruff, no package install needed ----------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ruff check
        run: uvx ruff check --output-format=github .
      - name: ruff format --check
        run: uvx ruff format --check .
      - name: validate agent skills
        # Frontmatter shape, reference reachability, portability terms, and
        # snippet compilation for .agents/skills/. 3.14-marked snippets need a
        # 3.14 interpreter; uv provisions it on demand.
        run: uv run -p 3.14 --no-project python scripts/validate_skills.py

  # ---- Lockfile consistency: pyproject <-> uv.lock cannot drift -----------
  # gpu-gateway is excluded: it ships no uv.lock (torch is installed out-of-band).
  lock-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [rag-common, graph-layout-rag, rag-literature-rag, pipeline-v2]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: uv lock --check
        working-directory: ${{ matrix.package }}
        run: uv lock --check

  # ---- Unit tests per package (hosted runner: no GPU, no keys, no network) -
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # gpu-gateway: the scheduler suite is pure stdlib — no ray/torch sync,
          # just pytest, exactly as gpu-gateway/pyproject.toml documents.
          - package: gpu-gateway
            # PYTHONPATH=src: --no-project skips installing the package, so the
            # pure-stdlib scheduler import needs src/ on the path (as documented).
            run: >
              PYTHONPATH=src
              uv run --no-project --with pytest --with pytest-asyncio
              pytest tests/test_scheduler.py -q
          # RAG packages: base sync (no GPU extras) then the offline unit subset.
          # --disable-socket makes any test that reaches the network fail loudly
          # (it should be marked @pytest.mark.integration instead).
          - package: rag-common
            run: >
              uv sync --frozen &&
              uv run --with pytest-socket
              pytest -m "not integration" --disable-socket --allow-unix-socket -q
          - package: graph-layout-rag
            run: >
              uv sync --frozen &&
              uv run --with pytest-socket
              pytest -m "not integration" --disable-socket --allow-unix-socket -q
          - package: rag-literature-rag
            run: >
              uv sync --frozen &&
              uv run --with pytest-socket
              pytest -m "not integration" --disable-socket --allow-unix-socket -q
          # pipeline-v2: same offline-only pattern. Its integration tests (real
          # postgres:16 + Kafka 4.x via docker, gated on RUN_INTEGRATION=1 in
          # tests/conftest.py) stay excluded here just like the other packages'
          # @pytest.mark.integration suites.
          - package: pipeline-v2
            run: >
              uv sync --frozen &&
              uv run --with pytest-socket
              pytest -m "not integration" --disable-socket --allow-unix-socket
              --allow-hosts=localhost,127.0.0.1 -q
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - name: ${{ matrix.package }} tests
        working-directory: ${{ matrix.package }}
        run: ${{ matrix.run }}
