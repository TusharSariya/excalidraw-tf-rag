[project]
name = "rag-common"
version = "0.1.0"
description = "Shared embedding providers for graph-layout-rag and rag-literature-rag"
requires-python = ">=3.11"
dependencies = [
  "sentence-transformers>=3.0.0",
  "accelerate>=0.30.0",
  # litmap knowledge-map layer: Leiden community detection over the fused
  # similarity graph. Both are native-extension packages (no pure-Python
  # fallback) — flagged in the E1 plan as a lock-file risk to watch.
  "python-igraph>=0.11.0",
  "leidenalg>=0.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# Learned-sparse retrieval encoders (rag_common.sparse_encode). FlagEmbedding
# powers the default BGE-M3 sparse head; the SPLADE-v3 path reuses the
# sentence-transformers SparseEncoder (core dep, needs a >=5.0 release). Only
# installed on the box that actually encodes the corpus / serves learned sparse.
sparse = ["FlagEmbedding>=1.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
