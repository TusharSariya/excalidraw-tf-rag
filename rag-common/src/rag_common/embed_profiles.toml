# Built-in embedding profiles for rag-common consumers (graph-layout-rag, repo-rag).
# Override or extend via RAG_EMBED_PROFILES_PATH and/or tool-local embed_profiles.toml.

[profiles.openai-large]
backend = "openai"
model = "text-embedding-3-large"
dimensions = 1024

[profiles.openai-small]
backend = "openai"
model = "text-embedding-3-small"
dimensions = 1024

[profiles.gemini]
backend = "gemini"
model = "gemini-embedding-001"
dimensions = 768

[profiles.gemini-2]
backend = "gemini"
model = "gemini-embedding-2-preview"
dimensions = 3072

[profiles.gemini-2-structure-v1]
backend = "gemini"
model = "gemini-embedding-2-preview"
dimensions = 3072

[profiles.gemini-2-code-3072]
backend = "gemini"
model = "gemini-embedding-2-preview"
dimensions = 3072

[profiles.mlx-qwen4b]
backend = "local"
model = "Qwen/Qwen3-Embedding-4B"
dimensions = 1024
quant = "4bit"

[profiles."mlx-qwen0.6b"]
backend = "local"
model = "Qwen/Qwen3-Embedding-0.6B"
dimensions = 1024
quant = "4bit"

# Apple-Silicon MLX 4-bit ladder, 8B rung (maps to mlx-community/Qwen3-Embedding-8B-4bit-DWQ).
# Held at 1024 dims to match mlx-qwen0.6b / mlx-qwen4b for an apples-to-apples MLX ladder.
[profiles."mlx-qwen8b"]
backend = "local"
model = "Qwen/Qwen3-Embedding-8B"
dimensions = 1024
quant = "4bit"

[profiles.local-fp16-qwen4b]
backend = "local"
model = "Qwen/Qwen3-Embedding-4B"
dimensions = 1024

# Code-specialized, max fidelity: Qwen3-Embedding-4B at native 2560 dims, full
# precision (no Matryoshka truncation, no quant). Tops MTEB-Code (~80.7) — the
# recommended local profile for code retrieval when quality matters over speed.
# Free on Apple Silicon (MLX); slower + more memory than the 4-bit mlx-qwen4b.
[profiles.qwen3-code]
backend = "local"
model = "Qwen/Qwen3-Embedding-4B"
dimensions = 2560

# CUDA dense embed (Ubuntu GPU box): Qwen3-0.6B @ 1024, 4-bit via bitsandbytes when available.
[profiles."cuda-qwen0.6b-1024"]
backend = "local"
model = "Qwen/Qwen3-Embedding-0.6B"
dimensions = 1024
quant = "4bit"

# Same Qwen3-0.6B CUDA embedding stack as cuda-qwen0.6b-1024, with indexed
# text enriched by document/section metadata before embedding and BM25.
[profiles."cuda-qwen0.6b-section-v1"]
backend = "local"
model = "Qwen/Qwen3-Embedding-0.6B"
dimensions = 1024
quant = "4bit"

# Qwen3-0.6B CUDA dimension sweep profiles. Chunking stays identical to the
# baseline; only the embedding output dimension changes.
[profiles."cuda-qwen0.6b-512-v1"]
backend = "local"
model = "Qwen/Qwen3-Embedding-0.6B"
dimensions = 512
quant = "4bit"

[profiles."cuda-qwen0.6b-768-v1"]
backend = "local"
model = "Qwen/Qwen3-Embedding-0.6B"
dimensions = 768
quant = "4bit"

# Same Qwen3-0.6B CUDA embedding stack, plus local-LLM contextual retrieval.
[profiles."cuda-qwen0.6b-contextual-v1"]
backend = "local"
model = "Qwen/Qwen3-Embedding-0.6B"
dimensions = 1024
quant = "4bit"

# Same Qwen3-0.6B CUDA embedding stack, with each paper's stored one-line TLDR
# prepended to the indexed (embed+BM25) text. A/B re-test of prefix embedding (T9).
[profiles."cuda-qwen0.6b-tldr-v1"]
backend = "local"
model = "Qwen/Qwen3-Embedding-0.6B"
dimensions = 1024
quant = "4bit"

# Same Qwen3-0.6B CUDA embedding stack, using smaller child chunks for a
# small-to-big retrieval probe while preserving document/section metadata.
[profiles."cuda-qwen0.6b-small2big-v1"]
backend = "local"
model = "Qwen/Qwen3-Embedding-0.6B"
dimensions = 1024
quant = "4bit"

# Same Qwen3-0.6B CUDA embedding stack, using larger section/page-span
# retrieval units for the LongRAG/larger-context campaign probe.
[profiles."cuda-qwen0.6b-longrag-v1"]
backend = "local"
model = "Qwen/Qwen3-Embedding-0.6B"
dimensions = 1024
quant = "4bit"

# CUDA dense embed quality probes on the Ubuntu GPU box: Qwen3-4B in 4-bit.
[profiles."cuda-qwen4b-1024"]
backend = "local"
model = "Qwen/Qwen3-Embedding-4B"
dimensions = 1024
quant = "4bit"

[profiles."cuda-qwen4b-2560"]
backend = "local"
model = "Qwen/Qwen3-Embedding-4B"
dimensions = 2560
quant = "4bit"

# Qwen3-4B CUDA 4-bit + local-LLM contextual retrieval (the 2026-06-27 campaign
# challenger to the 0.6B-contextual champion). Name contains "contextual" so
# ingest/contextual.py augments embed/BM25 text; reuses the embedder-agnostic
# contextual_cache.json from the 0.6B build (cache key is LLM backend:model, not
# the embedder) so Ollama barely runs during the 4B embed pass (8 GB OOM lever).
# Requires bitsandbytes on the CUDA box or the 4-bit load falls back to FP16/OOM.
[profiles."cuda-qwen4b-contextual-v1"]
backend = "local"
model = "Qwen/Qwen3-Embedding-4B"
dimensions = 1024
quant = "4bit"

# Qwen3-4B CUDA 4-bit, REAL late chunking (name contains "latechunk" → gated via
# ingest/latechunk.is_latechunk_profile). The window is embedded once at token
# level and each chunk vector is a mean-pool of its token span (see
# ingest/latechunk.py, rag_common.local_embed.pool_span). Embedding the window
# at native dim then Matryoshka-truncating to 1024.
[profiles."cuda-qwen4b-latechunk-v1"]
backend = "local"
model = "Qwen/Qwen3-Embedding-4B"
dimensions = 1024
quant = "4bit"

[profiles."cuda-qwen8b-1024"]
backend = "local"
model = "Qwen/Qwen3-Embedding-8B"
dimensions = 1024
quant = "4bit"

# jina-embeddings-v3: mean-pooled, bidirectional, 8192-ctx encoder — the model
# class late chunking was DESIGNED for (contrast Qwen3's causal/last-token pooling,
# where late chunking was a NULL). FP16 on CUDA (~570M params, no quant needed).
# Native 1024 dims. Task adapters (retrieval.passage/query) applied at encode time.
[profiles."jina-v3-1024"]
backend = "local"
model = "jinaai/jina-embeddings-v3"
dimensions = 1024

# Same jina-v3 encoder, REAL late chunking (name contains "latechunk" → gated via
# ingest/latechunk.is_latechunk_profile). The A/B partner to jina-v3-1024: isolates
# the late-chunking TECHNIQUE on the model it was built for.
[profiles."jina-v3-latechunk-v1"]
backend = "local"
model = "jinaai/jina-embeddings-v3"
dimensions = 1024
