[project]
name = "graph-layout-rag-training"
version = "0.1.0"
description = "Isolated SPLADE domain-adaptation training env for graph-layout-rag (contrastive LoRA). NOT part of the eval uv.lock."
requires-python = ">=3.10,<3.13"
dependencies = [
    # Pinned to coexist with the eval env (sentence-transformers 5.5.x, torch<2.6).
    # The merged checkpoint must load back through the eval env's SparseEncoder,
    # so we keep the same s-t major/minor and torch ABI window.
    "sentence-transformers>=5.5,<5.6",
    "torch>=2.4,<2.6",
    "transformers>=4.48",
    "peft>=0.13",
    "accelerate>=0.34",
    # Hard-negative mining + denoise (Qwen3-Reranker-4B nf4 4-bit) reuse:
    "bitsandbytes>=0.43",
    # Data plumbing (queries/triples over LanceDB chunks). lancedb/pyarrow read-only.
    "lancedb>=0.13",
    "pyarrow>=15",
    # Local-LLM query generation talks to Ollama over HTTP.
    "httpx>=0.27",
    # Transitive imports of the reused graph_layout_rag.paths / rag_common chain
    # (pure-python SDK shims; NO cloud calls are made — generation is local Ollama).
    "tiktoken>=0.7",
    "openai>=1.0",
    "datasets>=2.18",
]

[tool.uv]
# This is a standalone project; it is intentionally NOT referenced by the eval
# pyproject.toml / uv.lock. Build with:  uv sync --project training
