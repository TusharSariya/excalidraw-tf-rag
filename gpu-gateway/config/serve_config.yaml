# tools/gpu-gateway/config/serve_config.yaml
# Deploy with: serve run config/serve_config.yaml
# (from tools/gpu-gateway/ with .venv/bin/serve or after `uv sync`)
#
# runtime_env.pip is intentionally omitted — Ray would create an isolated pip env
# that overrides the uv venv. Rely on the venv activated before `serve run`.

proxy_location: HeadOnly
http_options:
  host: 0.0.0.0
  port: 8765

applications:
  - name: gpu-gateway
    route_prefix: /
    import_path: gpu_gateway.main:app
    deployments:
      - name: GatewayHTTP
        num_replicas: 1
        max_ongoing_requests: 100
        request_timeout_s: 180    # /v1/search subprocess timeout is 120s; keep 60s headroom
        ray_actor_options:
          num_cpus: 0.5
          num_gpus: 0

      - name: DenseEmbed4B
        num_replicas: 1
        request_timeout_s: 60    # cold load + 50-item batch can reach 35-40s; was 30 (too tight)
        ray_actor_options:
          num_cpus: 1
          num_gpus: 0.46    # 3000MB / 6500MB usable
        user_config:
          model: "Qwen/Qwen3-Embedding-4B"
          keep_on_cpu_after_evict: false   # opt-in RAM cache; 4B uses validate+fallback (bnb int8)

      - name: DenseEmbed06B
        num_replicas: 1
        request_timeout_s: 120    # batch_size=4 × 256 texts = 64 forward passes; ~60s worst case
        ray_actor_options:
          num_cpus: 1
          num_gpus: 0.12    # 800MB / 6500MB usable
        user_config:
          model: "Qwen/Qwen3-Embedding-0.6B"
          keep_on_cpu_after_evict: false   # opt-in RAM cache (~1.2 GB RAM when parked)

      - name: RerankerDeployment
        num_replicas: 1
        request_timeout_s: 15
        ray_actor_options:
          num_cpus: 1
          num_gpus: 0.15    # 1000MB / 6500MB usable
        user_config:
          model: "BAAI/bge-reranker-v2-m3"
          keep_on_cpu_after_evict: false   # opt-in RAM cache (~1.1 GB RAM when parked)

      - name: LLMDeployment
        num_replicas: 1
        request_timeout_s: 90    # Ollama cold-start ~10s; OLLAMA_KEEP_ALIVE=0 adds ~1s unload
        ray_actor_options:
          num_cpus: 0.5
          num_gpus: 0            # Ollama manages its own VRAM externally
        user_config:
          ollama_url: "http://127.0.0.1:11434"

      # SQLiteCache is a @ray.remote actor (not a @serve.deployment), so it is NOT
      # listed here — GatewayHTTP creates it lazily on first use. VRAM is serialized
      # in-process by GatewayHTTP's Scheduler (scheduler.py), which requires this
      # deployment to stay at num_replicas: 1 (it fails closed otherwise).
