[project]
name = "harvest"
version = "0.6.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tushar Sariya", email = "tushar.97@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arxiv>=4.0.0",
    "pdfplumber>=0.11.10",
    "pyalex>=0.21",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "requests>=2.33.1",
    "semanticscholar>=0.12.0",
    "supabase>=2.31.0",
]

[project.scripts]
harvest = "harvest:main"
harvest-work = "harvest.worker:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"
