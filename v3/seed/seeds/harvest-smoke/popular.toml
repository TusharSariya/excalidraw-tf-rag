# harvest-smoke — popular, well-covered papers
#
# A hand-built smoke-test corpus. Unlike the graph-layout-rag / rag-literature-rag
# catalogs (generated by build_seeds.py), this file is authored by hand to exercise
# EVERY harvest source. Each [[seed]] carries a human title plus one or more identity
# fields; across the set every identity field appears at least once, so no source
# keyed on a given id fans out to nothing:
#
#   arxiv_id       -> arxiv, s2
#   doi            -> unpaywall, crossref, opencitations, datacite, core, zenodo, figshare, osf
#   openalex_id    -> openalex
#   dblp_id        -> dblp
#   openreview_id  -> openreview
#   anthology_id   -> acl anthology
#   ia_identifier  -> internet archive
#
# Papers are famous and heavily indexed to maximise hit-rate. Every identifier below
# was verified LIVE against its source API before being written (see the task report).

corpus = "harvest-smoke"

# --- arxiv-only anchors (exercise arxiv + s2; not_found elsewhere by design) ---

[[seed]]
title    = "Attention Is All You Need"
arxiv_id = "1706.03762"

[[seed]]
title    = "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"
arxiv_id = "2005.11401"

[[seed]]
title    = "From Local to Global: A Graph RAG Approach to Query-Focused Summarization"
arxiv_id = "2404.16130"

[[seed]]
title    = "Sentence-BERT: Sentence Embeddings using Siamese BERT-Networks"
arxiv_id = "1908.10084"

# --- DOI seeds (unpaywall/crossref/opencitations/datacite/core/zenodo/figshare/osf) ---

[[seed]]
# Open-access PLOS ONE article — a guaranteed unpaywall hit.
title = "ForceAtlas2, a Continuous Graph Layout Algorithm for Handy Network Visualization"
doi   = "10.1371/journal.pone.0098679"

[[seed]]
title       = "Deep Residual Learning for Image Recognition (ResNet)"
doi         = "10.1109/CVPR.2016.90"
openalex_id = "W2194775991"

[[seed]]
title       = "ColBERT: Efficient and Effective Passage Search via Contextualized Late Interaction over BERT"
doi         = "10.1145/3397271.3401075"
openalex_id = "W3021397474"

[[seed]]
# Zenodo record — a DataCite DOI (not Crossref), to exercise datacite/zenodo.
title = "spaCy: Industrial-Strength NLP (Zenodo software record)"
doi   = "10.5281/zenodo.1212303"

# --- positive-control DOIs (verified LIVE 2026-07-24) ---
# figshare + opencitations both key on `doi`; the other DOI seeds above are
# publisher/arxiv DOIs with no figshare deposit and (for the arxiv ones) no
# OpenCitations record, so before these two seeds figshare/opencitations/osf had
# no guaranteed hit and could not be told apart from an always-miss bug.

[[seed]]
# PROVES figshare AND opencitations. PLOS pushes each figure to figshare with
# resource_doi = the article DOI, so POST /articles/search {"resource_doi": <doi>}
# returns 3 deposits (figshare hit). The same DOI resolves in the OpenCitations
# index (37 references, 66 citations) — small enough to fetch fast in a smoke run.
title = "Quantifying Organismal Complexity using a Population Genetic Approach"
doi   = "10.1371/journal.pone.0000217"

[[seed]]
# PROVES osf. An OSF-minted preprint DOI (10.31235/osf.io/<guid>, SocArXiv);
# OsfSource resolves the guid `mvhkc` from the DOI and GETs /v2/preprints/mvhkc/.
# Non-OSF DOIs correctly return None here, so this is the only OSF hit in the set.
title = "How Troubling is our Inheritance: A review of genetics and race in the social sciences"
doi   = "10.31235/osf.io/mvhkc"

# --- dblp seeds ---

[[seed]]
title   = "ImageNet Classification with Deep Convolutional Neural Networks (AlexNet)"
dblp_id = "conf/nips/KrizhevskySH12"
doi     = "10.1145/3065386"

[[seed]]
title   = "Attention Is All You Need (dblp CoRR record)"
dblp_id = "journals/corr/VaswaniSPUJGKP17"

# --- ACL Anthology seeds (also carry the matching anthology DOI) ---

[[seed]]
title        = "BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding"
anthology_id = "N19-1423"
doi          = "10.18653/v1/N19-1423"

[[seed]]
title        = "Dense Passage Retrieval for Open-Domain Question Answering"
anthology_id = "2020.emnlp-main.550"
doi          = "10.18653/v1/2020.emnlp-main.550"

# --- OpenReview seed ---

[[seed]]
title         = "An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale (ViT)"
openreview_id = "YicbFdNTTy"

# --- Internet Archive seed ---

[[seed]]
# archive.org scanned NeurIPS 2017 paper PDF.
title         = "Attention Is All You Need (NeurIPS 2017 proceedings scan)"
ia_identifier = "nips-2017-attention-is-all-you-need-paper_202510"
