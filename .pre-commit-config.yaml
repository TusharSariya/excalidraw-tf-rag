# Local pre-push guard for this repo. Install once:
#
#     cd tools && uvx pre-commit install --hook-type pre-push
#
# It mirrors CI's ruff gate and adds the guards CI can't (secrets, big files)
# BEFORE anything leaves your machine — the repo's ~42 GB of data and .env API
# keys are gitignored, and these hooks are the backstop if that ever slips.
# Fast (seconds, no tests); tests run in CI.
default_install_hook_types: [pre-push]
default_stages: [pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # A LanceDB index / PDF corpus / model weight would blow past this;
        # source and lockfiles never do.
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      # Catches OPENAI/OPENALEX/Gemini tokens etc. — defence in depth beyond
      # .gitignore, in case a secret is ever staged directly.
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      # Schema + expression validation for workflow YAML — catches things
      # like referencing `secrets` directly inside an `if:` (invalid GH
      # Actions syntax that breaks the whole workflow file, not just one
      # step) before it ever reaches GitHub.
      - id: actionlint

  - repo: local
    hooks:
      - id: check-supabase-migrations
        name: check supabase migrations (filename + RLS)
        entry: scripts/check-supabase-migrations.sh
        language: script
        pass_filenames: false
      - id: act-workflow-checks
        name: dry-run changed workflows with act
        entry: scripts/run-act-checks.sh
        language: script
        # Only fires when a workflow file is actually part of the push —
        # everyday pushes stay fast; the Docker/act cost is paid only when
        # you're editing .github/workflows/ (the situation this session's
        # two bugs both came from).
        files: ^\.github/workflows/.*\.ya?ml$
